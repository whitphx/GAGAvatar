[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gagavatar"
version = "0.1.0"
description = "GAGAvatar runtime and Gaussian avatar export helpers"
readme = "README.md"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["core*"]
namespaces = true
